name: Bug report
description: Report incorrect reference material, broken bridges, or workflow issues.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: input
    id: area
    attributes:
      label: Affected area
      description: Name the bridge, document, plugin, or workflow involved.
      placeholder: bridges/wordfence, docs/bridge-guide.md, php-lint workflow
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction details
      description: Include plugin versions, code samples, screenshots, or logs.
