name: Playground Smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp-version: ['latest', '6.8']
        php-version: ['8.2', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Playground smoke test
        env:
          WP_PLAYGROUND_WP_VERSION: ${{ matrix.wp-version }}
          WP_PLAYGROUND_PHP_VERSION: ${{ matrix.php-version }}
        run: bash ./scripts/run-playground-smoke.sh
